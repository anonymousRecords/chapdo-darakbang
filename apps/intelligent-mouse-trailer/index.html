<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>intelligent-mouse-trailer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <script>
      (function() {
        try { if (window.self !== window.top) return; } catch (e) { return; }
        var MOBILE_BREAKPOINT = 768;
        var MESSAGE = "데스크탑 환경에서만 접속 가능해요.";
        function showMobileBlock() {
          document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;padding:20px;text-align:center;font-family:system-ui,sans-serif;box-sizing:border-box;"><p style="font-size:18px;color:#333;margin:0;">' + MESSAGE + '</p></div>';
        }
        if (window.innerWidth < MOBILE_BREAKPOINT) showMobileBlock();
        window.addEventListener('resize', function() { if (window.innerWidth < MOBILE_BREAKPOINT) showMobileBlock(); });
      })();
    </script>
    <div id="trailer">
      <i id="trailer-icon" class="fa-solid fa-arrow-up-right"></i>
    </div>
    <div
      class="interactable"
      data-type="link"
      style="
        background-image: url(https://i.pinimg.com/736x/3c/51/d1/3c51d1fd754cfb70ec89502afee738a9.jpg);
      "
    ></div>

    <div
      class="interactable"
      data-type="video"
      style="
        background-image: url(https://i.pinimg.com/736x/91/bd/08/91bd0890d61eac742c8357f5b5667700.jpg);
      "
    ></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
