<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>websit-header</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  </head>
  <body>
    <script>
      (function() {
        try { if (window.self !== window.top) return; } catch (e) { return; }
        var MOBILE_BREAKPOINT = 768;
        var MESSAGE = "데스크탑 환경에서만 접속 가능해요.";
        function showMobileBlock() {
          document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;padding:20px;text-align:center;font-family:system-ui,sans-serif;box-sizing:border-box;"><p style="font-size:18px;color:#333;margin:0;">' + MESSAGE + '</p></div>';
        }
        if (window.innerWidth < MOBILE_BREAKPOINT) showMobileBlock();
        window.addEventListener('resize', function() { if (window.innerWidth < MOBILE_BREAKPOINT) showMobileBlock(); });
      })();
    </script>
    <div id="menu">
      <div id="menu-items">
        <div class="menu-item">Home</div>
        <div class="menu-item">Shop</div>
        <div class="menu-item">About</div>
        <div class="menu-item">Contact Us</div>
      </div>
      <div id="menu-background-pattern"></div>
      <div id="menu-background-image"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
